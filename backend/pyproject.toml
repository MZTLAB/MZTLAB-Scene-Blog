[project]
name = "mztlab-backend"
version = "3.0.0"
description = "MZTLAB Scene blog backend (FastAPI + SQLite)"
requires-python = ">=3.11"
# Runtime dependencies are intentionally not duplicated here: requirements.txt is
# the single source of truth for the deployable environment (see backend/Dockerfile).
dependencies = []

# ---------------------------------------------------------------------------
# Ruff — linting + formatting
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]
extend-exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
# Sensible baseline; new code must stay clean.
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection defaults (`Depends(...)`, `Query(...)`) are the
# documented pattern, not the mutable-default bug B008 is meant to catch.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
    # First-party permission dependency factory: `Depends(require_permission("x"))`
    # is the same immutable-dependency pattern as `Depends(...)` itself.
    "app.deps.require_permission",
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use assert statements and loose typing helpers.
"tests/*" = ["S101", "B011"]
"tests/test_content.py" = ["S101", "B011", "E501"]  # legacy long assertions, rewritten later
# Intentional, documented exceptions (the 2.x ratchet is gone: all rewritten
# modules are lint-clean):
# * the image payload keeps its historical short key names (s/l/f) for the web UI;
# * the demo-content fixtures embed long Markdown paragraphs on single lines.
"app/api/models.py" = ["E741"]
"app/seed.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = false

# ---------------------------------------------------------------------------
# mypy — static typing
# ---------------------------------------------------------------------------
# Global baseline: 2.x modules are checked with relaxed flags (no untyped-def
# requirement). The new 3.0.0 packages (app/settings, app/services, app/scripts)
# opt into strict flags below; legacy modules that cannot pass yet are pinned in
# the progressive ignore list (ratchet) at the bottom.
[tool.mypy]
python_version = "3.11"
files = ["app"]
warn_unused_configs = true
warn_redundant_casts = true
show_error_codes = true
show_column_numbers = true
pretty = true
disallow_untyped_defs = false
check_untyped_defs = false
ignore_missing_imports = false

# Strict scope for the 3.0.0 domain layer. Legacy modules keep the relaxed global
# baseline (they have since been rewritten and type-check anyway), so there is no
# progressive ignore list any more.
[[tool.mypy.overrides]]
module = ["app.settings", "app.settings.*", "app.services", "app.services.*", "app.scripts", "app.scripts.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
no_implicit_optional = true

# Third-party packages without stubs. Keep this list limited to libraries we do
# not control; first-party modules must never be listed here.
[[tool.mypy.overrides]]
module = ["boto3", "botocore.*", "bleach", "markdown", "markdown.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "default",
    # Third-party deprecations must not turn the suite red; fix our own code instead.
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    # The settings group is named `copy` (domain language); Pydantic warns that
    # it shadows BaseModel.copy, which is harmless because we never call it.
    'ignore:Field name "copy".*:UserWarning',
]
