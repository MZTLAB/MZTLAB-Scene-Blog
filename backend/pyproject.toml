[project]
name = "mztlab-backend"
version = "3.0.0-beta1"
description = "MZTLAB Scene blog backend (FastAPI + SQLite)"
requires-python = ">=3.11"
# Runtime dependencies are intentionally not duplicated here: requirements.txt is
# the single source of truth for the deployable environment (see backend/Dockerfile).
dependencies = []

# ---------------------------------------------------------------------------
# Ruff — linting + formatting
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]
extend-exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
# Sensible baseline; new code must stay clean.
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection defaults (`Depends(...)`, `Query(...)`) are the
# documented pattern, not the mutable-default bug B008 is meant to catch.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
    # First-party permission dependency factory: `Depends(require_permission("x"))`
    # is the same immutable-dependency pattern as `Depends(...)` itself.
    "app.deps.require_permission",
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use assert statements and loose typing helpers.
"tests/*" = ["S101", "B011"]
"tests/test_content.py" = ["S101", "B011", "E501"]  # legacy long assertions, rewritten later

# Progressive ignore list (ratchet): existing 2.x modules are listed here with
# only the rules they currently violate. New code must not add entries, and the
# list shrinks as each module is rewritten in 3.0.0. Never add global `ignore`
# entries to silence existing code.
"app/content.py" = ["UP017"]  # datetime.timezone.utc -> datetime.UTC
"app/db.py" = ["UP017", "UP035"]
"app/deps.py" = ["SIM118", "UP035"]
"app/exif.py" = ["SIM102"]
"app/images.py" = ["E501", "SIM105"]
"app/main.py" = ["F401"]
"app/permissions.py" = ["UP035"]
"app/posts.py" = ["UP035"]
"app/photo_exif.py" = ["UP035"]
"app/schemas.py" = ["UP037"]
"app/security.py" = ["SIM118", "UP006", "UP017", "UP035"]
"app/seed.py" = ["E501", "F401", "F841", "UP017"]
"app/storage.py" = ["SIM105", "UP035", "UP037"]
"app/storage_sync.py" = ["UP035"]
# The image payload keeps its historical short keys (s/l/f) for the frontend.
"app/api/models.py" = ["E741"]
"app/routes/gallery_admin.py" = ["E501", "I001"]
"app/routes/media.py" = ["E501", "SIM105", "UP017"]
"app/routes/public.py" = ["E501", "F541"]
"app/routes/users.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = false

# ---------------------------------------------------------------------------
# mypy — static typing
# ---------------------------------------------------------------------------
# Global baseline: 2.x modules are checked with relaxed flags (no untyped-def
# requirement). The new 3.0.0 packages (app/settings, app/services, app/scripts)
# opt into strict flags below; legacy modules that cannot pass yet are pinned in
# the progressive ignore list (ratchet) at the bottom.
[tool.mypy]
python_version = "3.11"
files = ["app"]
warn_unused_configs = true
warn_redundant_casts = true
show_error_codes = true
show_column_numbers = true
pretty = true
disallow_untyped_defs = false
check_untyped_defs = false
ignore_missing_imports = false

# Strict scope for new 3.0.0 packages. `app.settings` joins this list once
# Phase 1 finishes typing models/store (it is pinned in the temporary ratchet
# section below for now so `mypy app` stays green during the refactor).
[[tool.mypy.overrides]]
module = ["app.services", "app.services.*", "app.scripts", "app.scripts.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
no_implicit_optional = true

# Third-party packages without stubs. Keep this list limited to libraries we do
# not control; first-party modules must never be listed here.
[[tool.mypy.overrides]]
module = ["boto3", "bleach", "markdown", "markdown.*"]
ignore_missing_imports = true

# TEMPORARY (Phase 1 in progress): app/settings is actively being written and
# does not type-check yet. Once it does, delete this section and add
# "app.settings", "app.settings.*" to the strict override above.
[[tool.mypy.overrides]]
module = ["app.settings", "app.settings.*"]
ignore_errors = true

# Progressive mypy ignore list (ratchet), same policy as ruff: every module
# here is a 2.x module that cannot type-check yet. Remove an entry as soon as
# that module is rewritten in 3.0.0; never add a global exception.
[[tool.mypy.overrides]]
module = [
    "app.content",
    "app.galleries",
    "app.images",
    "app.posts",
    "app.seed",
    "app.storage",
    "app.routes.auth",
    "app.routes.gallery_admin",
    "app.routes.media",
    "app.routes.media_serve",
    "app.routes.public",
    "app.routes.users",
]
ignore_errors = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "default",
    # Third-party deprecations must not turn the suite red; fix our own code instead.
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    # The settings group is named `copy` (domain language); Pydantic warns that
    # it shadows BaseModel.copy, which is harmless because we never call it.
    'ignore:Field name "copy".*:UserWarning',
]
