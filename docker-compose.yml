services:
  # Single-layer ingress: an operator-maintained nginx (see docs/EDGE.md) routes
  # `/api` and `/media` to `backend` and everything else to `frontend`. The two
  # application services only publish on the host loopback for that ingress.
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      BLOG_DATA_DIR: /app/data
      BLOG_FRONTEND_URL: http://127.0.0.1:4321
      # 3.0.0 initialises an empty database only; set to "true" for demo data.
      BLOG_SEED_DEMO: "false"
      BLOG_SESSION_DAYS: "7"
      # The API trusts forwarded headers from the ingress only. Set this to the
      # address nginx connects from (loopback in a host-installed setup).
      BLOG_TRUSTED_PROXY: ${BLOG_TRUSTED_PROXY:-127.0.0.1}
      # Optional first-run account. Leave empty to use the /admin/setup page.
      BLOG_ADMIN_USER: ""
      BLOG_ADMIN_PASSWORD: ""
      BLOG_ADMIN_NAME: "MZTLAB"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - blog_data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Server-side data fetching (SSR) talks to the API over the private
      # compose network. The browser never reaches this address.
      BLOG_API_INTERNAL_URL: http://backend:8000
      HOST: 0.0.0.0
      PORT: 4321
    ports:
      - "127.0.0.1:4321:4321"

volumes:
  blog_data:
