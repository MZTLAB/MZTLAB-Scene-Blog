name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref: a new push cancels the previous, still-running build.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff check
        run: python -m ruff check app

      - name: mypy
        run: python -m mypy app

      # Contract gate: every 2xx JSON response must be a named $ref and the spec
      # must contain no `additionalProperties: true`.
      - name: OpenAPI contract audit
        run: python -m app.scripts.audit_contracts

      - name: pytest
        run: python -m pytest

  frontend:
    name: Frontend (check, lint, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Astro/TypeScript check
        run: npm run check

      - name: ESLint
        run: npm run lint

      - name: Build
        run: npm run build

      # Frontend unit tests are introduced with the dom.ts/form.ts primitives in
      # Phase 4; until then the frontend gate is check + lint + build.
      - name: Vitest
        run: npm test --if-present
        continue-on-error: true

  contracts:
    name: Contracts (OpenAPI -> TypeScript types, drift check)
    runs-on: ubuntu-latest
    # Keeps the checked-in `frontend/src/api/openapi.json` and
    # `frontend/src/api/types.gen.ts` byte-identical to what the backend
    # generates; a hand-edited contract or type fails the job.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Export OpenAPI contract
        working-directory: backend
        run: python -m app.scripts.export_contracts

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate TypeScript types
        working-directory: frontend
        run: npm run gen:types

      - name: Fail on contract drift
        run: git diff --exit-code
